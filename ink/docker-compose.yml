version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=inkschedule_db
      - POSTGRES_USER=usuario_tatuaje
      - POSTGRES_PASSWORD=password_secreto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://usuario_tatuaje:password_secreto@db:5432/inkschedule_db

volumes:
  postgres_data:  